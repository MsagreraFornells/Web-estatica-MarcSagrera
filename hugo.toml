  [params.homeInfoParams]
    Title = "InfraTech Web Estatica"
    Content = """
**InfraTech** un projecte dedicat a l'aprenentatge dels sistemes informàtics, les xarxes i els serveis de xarxa.

**L'objectiu** d'aquesta web és oferir informació clara i pràctica sobre Linux, els protocols de comunicació i la configuració de serveis com SSH i HTTP.

A través de diferents seccions, podràs consultar conceptes, configuracions i exemples útils per aprendre administració de sistemes.


Seccions principals:

- [Linux](linux/): usuaris, grups i permisos
- [Xarxes](xarxes/): TCP/IP i DNS
- [Serveis](serveis/): SSH i HTTP
- [Blog](blog/): articles tècnics
"""

