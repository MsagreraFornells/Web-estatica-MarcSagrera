baseURL = "https://MsagreraFornells.github.io/Web-estatica-MarcSagrera/"
languageCode = "ca"
title = "NovaSys IT Docs"
theme = "PaperMod"

[params]
  description = "Documentació tècnica del departament d'informàtica de NovaSys"
  author = "Marc Sagrera"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowToc = true
  ShowBreadCrumbs = true

  [params.assets]
    favicon = "favicon.svg"

  [params.homeInfoParams]
    Title = "NovaSys IT Docs"
    Content = """
**NovaSys** és una empresa fictícia de serveis informàtics. Aquesta web és la base de coneixement del departament de sistemes.

**Objectiu:** que un administrador de sistemes pugui consultar ràpidament guies de Linux, xarxes i serveis.

Seccions principals:

- [Linux](linux/): usuaris, grups i permisos
- [Xarxes](xarxes/): TCP/IP i DNS
- [Serveis](serveis/): SSH i HTTP
- [Blog](blog/): articles tècnics
"""

[[menus.main]]
  name = "Inici"
  pageRef = "/"
  weight = 1
[[menus.main]]
